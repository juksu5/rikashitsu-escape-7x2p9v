<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex,nofollow">
    <title>理科室の掟：正しい点火と消火</title>
    <style>
        body { background-color: #000; color: #eee; text-align: center; font-family: serif; overflow: hidden; margin: 0; }
        #game-container { 
            width: 800px; height: 500px; margin: 20px auto; position: relative;
            background: url('assets/bg_lab.jpg') no-repeat center/cover;
            border: 5px solid #333; overflow: hidden; display: none;
        }
        #enemy { position: absolute; top: 50px; left: 320px; font-size: 100px; transition: 0.5s; z-index: 5; opacity: 0; pointer-events: none; }
        .item { position: absolute; user-select: none; z-index: 20; }
        
        /* 器具の配置 */
        #lamp { bottom: 60px; left: 350px; width: 100px; cursor: pointer; }
        #matchbox { bottom: 50px; right: 50px; width: 120px; }
        #hand-item { position: absolute; pointer-events: none; z-index: 100; width: 60px; display: none; } /* マウスに追従するマッチや蓋 */
        
        #status-bar { font-size: 22px; color: #ff3333; margin: 15px; text-shadow: 2px 2px 4px #000; height: 30px; }
        #gate-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
    </style>
</head>
<body>

    <div id="gate-screen">
        <h1>理科室の扉</h1>
        <input type="password" id="pass-input" placeholder="合言葉">
        <button onclick="checkPass()">入室</button>
    </div>

    <div id="status-bar"></div>

    <div id="game-container" onmousemove="handleMouseMove(event)">
        <div id="timer" style="position:absolute; top:10px; right:20px; font-size:24px;">TIME: 30</div>
        <div id="enemy">💀</div>
        
        <img id="lamp" src="assets/lamp_close.png" onclick="clickLamp()">
        
        <img id="matchbox" src="assets/matchbox.png">

        <img id="hand-item" src="">
    </div>

    <script>
        const PASSWORD = "seik";
        const bgm = new Audio('assets/bgm_horror.mp3');
        const seScratch = new Audio('assets/se_match.mp3');
        const seIgnite = new Audio('assets/se_ignite.mp3');
        const seGameOver = new Audio('assets/se_gameover.mp3'); // ゲームオーバー曲

        let step = 0; // 0:待機, 1:蓋取った, 2:火がついた, 3:点火成功, 4:消火成功
        let timeLeft = 30;
        let lastX = 0;
        let gameOver = false;

        function checkPass() {
            if (document.getElementById('pass-input').value === PASSWORD) {
                document.getElementById('gate-screen').style.display = 'none';
                document.getElementById('game-container').style.display = 'block';
                startGame();
            }
        }

        function startGame() {
            bgm.loop = true;
            bgm.play();
            updateStatus("ランプの蓋をクリックして取れ...");
            setInterval(updateTimer, 1000);
        }

        function updateTimer() {
            if (gameOver) return;
            timeLeft--;
            document.getElementById('timer').innerText = "TIME: " + timeLeft;
            const enemy = document.getElementById('enemy');
            enemy.style.opacity = (30 - timeLeft) / 20;
            enemy.style.transform = `scale(${1 + (30 - timeLeft) * 0.8})`;
            if (timeLeft <= 0) endGame("標本が追いついた...", false);
        }

        function clickLamp() {
            if (gameOver) return;
            if (step === 0) {
                step = 1;
                document.getElementById('lamp').src = "assets/lamp_open.png";
                showHandItem("assets/match_stick.png");
                updateStatus("マッチ箱で「右から左」へ素早く擦れ！");
            } else if (step === 2) {
                step = 3;
                seIgnite.play();
                document.getElementById('lamp').src = "assets/lamp_fire.png";
                showHandItem("assets/lamp_cap.png"); // 次は蓋を持つ
                updateStatus("最後に蓋を「横から」スライドさせて消せ！");
            }
        }

        function handleMouseMove(e) {
            if (gameOver) return;
            const hand = document.getElementById('hand-item');
            hand.style.left = (e.pageX - 30) + "px";
            hand.style.top = (e.pageY - 30) + "px";

            // マッチを擦る判定（右から左へ高速移動）
            if (step === 1) {
                const speed = lastX - e.pageX;
                const rect = document.getElementById('matchbox').getBoundingClientRect();
                if (e.pageX > rect.left && e.pageX < rect.right && e.pageY > rect.top && e.pageY < rect.bottom) {
                    if (speed > 20) { // 右から左への速度
                        step = 2;
                        seScratch.play();
                        hand.src = "assets/match_fire.png";
                        updateStatus("火がついた！芯をクリックして点火せよ！");
                    }
                }
            }
            
            // 横から蓋をかぶせる判定
            if (step === 3) {
                const lampRect = document.getElementById('lamp').getBoundingClientRect();
                const speedX = Math.abs(e.pageX - lastX);
                if (e.pageX > lampRect.left && e.pageX < lampRect.right && e.pageY > lampRect.top && e.pageY < lampRect.bottom) {
                    if (speedX > 10 && e.pageY > lampRect.top + 10) { // 横方向の動き
                        step = 4;
                        document.getElementById('lamp').src = "assets/lamp_close.png";
                        hand.style.display = "none";
                        endGame("完璧な作法だ。脱出成功！", true);
                    }
                }
            }
            lastX = e.pageX;
        }

        function showHandItem(src) {
            const hand = document.getElementById('hand-item');
            hand.src = src;
            hand.style.display = "block";
        }

        function updateStatus(msg) {
            document.getElementById('status-bar').innerText = msg;
        }

        function endGame(msg, success) {
            gameOver = true;
            bgm.pause();
            if (!success) seGameOver.play();
            setTimeout(() => {
                alert(msg);
                location.reload();
            }, 500);
        }
    </script>
</body>
</html>
